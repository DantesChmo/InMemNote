# Continuous integration for Inmemnote.
#
# Jobs:
#
#   1. `quality`        — typecheck, lint, unit tests on Linux (fast, cheap).
#   2. `e2e-prepare`    — macOS: install deps (builds the native addon),
#                         fetch the Electron binary, run `e2e:prepare` (Forge
#                         package + Vite renderer build). Uploads a single tarball that
#                         every shard reuses, so we pay this multi-minute cost
#                         once per run instead of once per shard.
#   3. `e2e`            — macOS matrix: each shard downloads the tarball and
#                         runs its slice of the Playwright suite via
#                         `--shard=<i>/<total>`. Combined with 2 Playwright
#                         workers per shard (see `playwright.config.ts`), this
#                         fans the suite across ~6 parallel Electron instances.
#
# Releases live in `release.yml`, which calls this workflow (`workflow_call`)
# as its test gate, so a DMG is never published without a green run. That is
# why tag pushes are not a trigger here: the tag would run the suite twice.
#
# Node 22 is the LTS we target. Every job reads the version from `.nvmrc`
# (`node-version-file`) so CI and local dev share one source of truth and we
# don't drift if the runner default moves.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Cancel in-flight runs of the same ref. PR pushes shouldn't queue up minutes.
# When called from `release.yml` the ref is the tag; the caller uses its own
# `release-` group, so the two never wait on each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Cache `node_modules` keyed by the lockfile. On hit we skip `npm ci`.
      # The key includes the OS to keep Linux and macOS trees apart.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-quality-node-modules-${{ hashFiles('package-lock.json') }}

      # `--ignore-scripts` skips every install script — those builds aren't
      # needed for typecheck/lint/unit tests and pull in extra toolchain on
      # Linux. The unit suite does open real `:memory:` SQLite databases, but
      # `better-sqlite3` (13+) is an N-API addon that ships prebuilt binaries
      # for Linux and macOS, so there is nothing to compile.
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Regenerate `e2e/TEST-PLAN.md` from the JSDoc on each `test(...)`
      # and fail if the committed file is out of sync. Cheap (~1 s, no
      # deps beyond Node) and catches two classes of mistake at once:
      #   1. a new test added without `@scenario`/`@area`/… JSDoc;
      #   2. an existing test whose docstring drifted from the rendered plan.
      - name: Check e2e test plan is up to date
        run: npm run check:test-plan

  e2e-prepare:
    name: E2E prepare (package + native build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Cache `node_modules` together with the compiled native addon. The key
      # is OS-scoped and includes the lockfile, the native addon's gyp file,
      # and its sources — touching any of those is what would actually
      # invalidate the build. We also include
      # `native/window-events/build` in the cached paths so the
      # gyp-produced binary survives across runs and gets picked up by
      # the bundle step below.
      - name: Cache node_modules + native build
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            native/window-events/build
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('package-lock.json', 'native/window-events/binding.gyp', 'native/window-events/src/**') }}

      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Since Electron 42 the `electron` package no longer downloads its
      # binary in `postinstall`; it does so lazily on the first
      # `require('electron')`. Fetch it here, on cache miss, so the binary
      # lands in the cached `node_modules` and in the e2e tarball — otherwise
      # every shard would download it again when Playwright launches the app.
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        name: Download Electron binary
        run: npx install-electron --no

      # No `@electron/rebuild` step: both native addons (`better-sqlite3` and
      # `@inmemnote/window-events`) are N-API, whose ABI is stable across
      # Node and Electron, so the binaries `npm ci` produced load as-is.

      - name: Forge package
        run: npm run e2e:prepare

      # Tar before upload: `node_modules` is hundreds of thousands of small
      # files, and `actions/upload-artifact` is dramatically slower over that
      # shape than over one large blob. The shards pay a single ~30 s
      # extract instead of multi-minute per-file IO.
      #
      # `native/window-events/build` carries the compiled native addon
      # (window_events.node). It's gitignored, produced by `npm ci`'s
      # postinstall (node-gyp rebuild) here on the prepare runner, and
      # `main.cjs` requires it at startup — without it Electron throws
      # "Cannot find module ./build/Release/window_events.node" and the
      # whole suite hangs at `electron.launch()` (run 27275066075).
      - name: Bundle prepared workspace
        run: tar -czf e2e-bundle.tar.gz node_modules .vite native/window-events/build

      - name: Upload e2e bundle
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bundle
          path: e2e-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: e2e-prepare
    runs-on: macos-15
    strategy:
      # One shard's failure shouldn't cancel the others — we want the full
      # picture of which slices are red before respinning CI.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download e2e bundle
        uses: actions/download-artifact@v8
        with:
          name: e2e-bundle

      - name: Extract bundle
        run: tar -xzf e2e-bundle.tar.gz

      - name: Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per-shard name avoids collision when multiple shards fail.
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
